name: CI

# Runs on PRs (including ones opened and updated by Claude) and on main. A failure on main is
# picked up by Incident Intake and turned into an issue for Claude to fix.
on:
  pull_request:
  push:
    branches: [main]
  # Required check for merge queues, if the repository uses one
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
