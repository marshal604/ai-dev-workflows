name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Cancel an in-flight review when a newer push arrives on the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Auto-fix opens draft PRs from autofix/* branches: review those too. Skip follow-up pushes made
    # by bots (e.g. @claude edits on a PR): re-reviewing an agent's own change mostly adds noise.
    # Skip Dependabot: its runs get no repository secrets, and version bumps are checked by CI and a person.
    if: |
      (github.event.pull_request.draft == false || startsWith(github.head_ref, 'autofix/')) &&
      !(endsWith(github.actor, '[bot]') && github.event.action == 'synchronize') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The built-in /code-review reads the diff from local git; the PR merge commit's
          # first parent is the base branch, so depth 2 makes `git diff HEAD~1` the full PR diff
          fetch-depth: 2

      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          # Subscription token from `claude setup-token` (Pro / Max / Team / Enterprise)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action rejects bot-triggered runs by default; Auto-fix PRs are opened by its own App
          allowed_bots: marshal604-autofix
          # Built-in /code-review skill (bundled with Claude Code), effort level "high"
          # Its --comment flag does not post from CI, so the prompt asks for inline comments explicitly
          prompt: |
            /code-review high ${{ github.event.pull_request.number }}

            After the review, post every finding as an inline comment on PR #${{ github.event.pull_request.number }} using the mcp__github_inline_comment__create_inline_comment tool, one comment per finding, on the line it concerns. If there are no findings, post nothing.
          claude_args: '--allowedTools "Task,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*)"'
