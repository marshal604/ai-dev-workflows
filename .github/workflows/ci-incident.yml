name: CI Incident

# Internal monitoring source: when CI fails on main, open one `incident` issue per broken workflow
# and hand it to Auto-fix. External monitors open issues through the GitHub API instead.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Only intake and resolve share a lock, and both take seconds. A workflow-level lock also held the
# Auto-fix call, so a recovery waited minutes behind the fix it made unnecessary.
# ponytail: GitHub keeps one pending run per group, so a burst of three or more CI results on main
# within seconds can drop a middle one; a reconciliation job that re-reads main's CI state fixes that.
jobs:
  intake:
    if: github.event.workflow_run.conclusion == 'failure'
    concurrency:
      group: ci-incident
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    outputs:
      issue: ${{ steps.upsert.outputs.issue }}
      is_new: ${{ steps.upsert.outputs.is_new }}
    steps:
      - name: Open a new issue or record a repeat
        id: upsert
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          PUSHER: ${{ github.event.workflow_run.actor.login }}
        run: |
          set -euo pipefail
          fingerprint="ci-$(printf '%s' "$RUN_NAME" | tr -c 'a-zA-Z0-9' '-')"
          marker="<!-- incident-fingerprint: $fingerprint -->"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label incident --state open --limit 200 \
            --json number,body --jq "map(select(.body | contains(\"$marker\"))) | .[0].number // empty")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again at $RUN_SHA: $RUN_URL"
            echo "issue=$existing" >> "$GITHUB_OUTPUT"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Drop the job/step columns, timestamps, BOM and colour codes, so the issue (and its Slack card) leads
          # with the failing lines instead of runner noise
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | cut -f3- \
            | sed -E -e $'s/^\xEF\xBB\xBF//' -e 's/^[0-9T:.-]+Z ?//' -e $'s/\x1b\\[[0-9;]*m//g' | cut -c1-300 \
            > "$RUNNER_TEMP/log.txt" || true
          key="$(grep -E 'not ok|FAIL|[Ee]rror:|##\[error\]' "$RUNNER_TEMP/log.txt" | head -n 15 || true)"
          {
            echo "**Source:** \`ci\`"
            echo
            # Read by the Slack announcement; the @mention notifies the pusher, who reverts first
            echo "**Breaking commit:** ${RUN_SHA:0:7} \"$(printf '%s' "$COMMIT_MSG" | head -n 1 | cut -c1-100)\" pushed by @$PUSHER"
            echo
            echo "The $RUN_NAME workflow failed on main: $RUN_URL"
            echo
            echo '```'
            if [ -n "$key" ]; then echo "$key"; else tail -n 20 "$RUNNER_TEMP/log.txt"; fi
            echo '```'
            echo
            echo '<details><summary>Last 80 log lines</summary>'
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/log.txt"
            echo '```'
            echo '</details>'
            echo
            echo "$marker"
          } > "$RUNNER_TEMP/body.md"

          gh label create incident --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Bug for Claude to auto-fix" --force >/dev/null
          url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "CI failing on main: $RUN_NAME" \
            --body-file "$RUNNER_TEMP/body.md" --label incident)"
          echo "issue=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "is_new=true" >> "$GITHUB_OUTPUT"

  # A green run on the current main ends the failure episode. Without this, an issue left open after a
  # manual fix would swallow the next, unrelated break as a "Failed again" comment.
  resolve:
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: ci-incident
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Close the open CI issue and its Auto-fix PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # A green run for an older commit says nothing about the current main.
          # Its own assignment, so an API failure fails the job instead of reading as "not current".
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [ "$head" = "$RUN_SHA" ] || exit 0
          fingerprint="ci-$(printf '%s' "$RUN_NAME" | tr -c 'a-zA-Z0-9' '-')"
          marker="<!-- incident-fingerprint: $fingerprint -->"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label incident --state open --limit 200 \
            --json number,body --jq "map(select(.body | contains(\"$marker\"))) | .[].number"); do
            # Main recovered without it (usually a revert), so its Auto-fix PR would only sit in the review queue
            for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "head:autofix/issue-$n" \
              --json number,headRefName --jq ".[] | select(.headRefName | test(\"^autofix/issue-$n(-|\$)\")) | .number"); do
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment "Closed: main is green again at $RUN_SHA without this change."
            done
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "CI is green again on main at $RUN_SHA: $RUN_URL"
          done

  fix:
    needs: intake
    if: needs.intake.outputs.is_new == 'true'
    # The agent job is read-only; publishing uses the Auto-fix GitHub App's own token
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/autofix.yml
    with:
      issue: ${{ fromJSON(needs.intake.outputs.issue) }}
    secrets: inherit
