name: Claude Code

# Human-triggered path: add the `claude` label to an issue, or mention @claude in a comment
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Pinned to v5: checkout v6+ persists GITHUB_TOKEN via includeIf, which the action cannot
      # clean up, so pushes use GITHUB_TOKEN and do not trigger CI. Revisit once
      # claude-code-action#1722 lands.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash(npm ci:*),Bash(npm test:*),Bash(npm run typecheck:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(gh pr create:*)"
            --append-system-prompt "When you work from an issue and push changes, open a pull request with gh pr create whose body starts with 'Fixes #<issue number>'."
