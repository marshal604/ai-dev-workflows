name: Claude Code

# Conversational path: mention @claude in an issue or PR comment.
# Labeling an issue `claude` goes through Auto-fix instead, which verifies and publishes the change.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One @claude run at a time per issue / PR, so two requests never push over each other
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Pinned to v5: checkout v6+ persists GITHUB_TOKEN via includeIf, which the action cannot
      # clean up, so pushes use GITHUB_TOKEN and do not trigger CI. Revisit once
      # claude-code-action#1722 lands.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash(npm ci:*),Bash(npm test:*),Bash(npm run typecheck:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(gh pr create:*)"
